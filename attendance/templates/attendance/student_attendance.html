<!-- templates/attendance/student_attendance.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance</title>
</head>
<body>
    <h1>Your Attendance</h1>

    <p>Your attendance percentage: {{ attendance_percentage|floatformat:2 }}%</p>

    <h2>Attendance Records</h2>
    <ul>
        {% for record in attendance %}
            <li>{{ record.date }} - {{ record.period }} - {% if record.present %}Present{% else %}Absent{% endif %}</li>
        {% endfor %}
    </ul>
</body>
</html>

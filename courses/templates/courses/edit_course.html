{% extends 'base.html' %}
{% block content %}
  <h1>{% if course %}Edit{% else %}Add{% endif %} Course</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
  <a href="{% url 'courses:course_list' %}">Back to Course List</a>
{% endblock %}
